name: Docker Build, Push, and Deploy

# Run only when commits are pushed to the week02 branch
on:
  push:
    branches: [ "week02" ]

jobs:
  # Job 1 (from T5E3): build the image and push it to Docker Hub
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Copy the repository files (Dockerfile, app.py, ...) onto the runner
      - name: Check out code
        uses: actions/checkout@v4

      # 2. Set up Buildx, the BuildKit-based builder that build-push-action uses
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Log in to Docker Hub; the values come from repository secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Build the image with metadata labels, then push it with two tags
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .          # build from the checked-out files
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.event.repository.html_url }}
            org.opencontainers.image.revision=${{ github.sha }}
            build.source=github-actions
            build.workflow=${{ github.workflow }}
            build.run_id=${{ github.run_id }}
            build.run_number=${{ github.run_number }}

  # Job 2 (new): use AWS Systems Manager to run the new image on EC2
  deploy:
    needs: build          # start only after the build job has succeeded
    runs-on: ubuntu-latest

    steps:
      # 1. Give the AWS CLI on the runner my Learner Lab credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 2. Send the deployment commands to the instance through SSM (no SSH)
      - name: Deploy to EC2 via SSM
        id: send
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "GitHub Actions run ${{ github.run_number }}: deploy commit ${{ github.sha }}" \
            --parameters '{"commands": [
              "set -e",
              "docker pull ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest",
              "docker stop cs6620-app || true",
              "docker rm cs6620-app || true",
              "docker run -d --name cs6620-app --restart unless-stopped -p 80:5000 ${{ secrets.DOCKERHUB_USERNAME }}/cs6620-app:latest",
              "docker ps --filter name=cs6620-app",
              "sleep 10",
              "curl -fsSI http://localhost/"
            ]}' \
            --query "Command.CommandId" \
            --output text)
          echo "SSM command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      # 3. Wait until the commands finish on EC2, show their output, and fail if they failed
      - name: Verify deployment
        env:
          COMMAND_ID: ${{ steps.send.outputs.command_id }}
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          # Ask SSM every 5 seconds (for up to 100 seconds) until the command is done
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          # Get the result once, then print the parts we need (jq reads JSON)
          RESULT=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID")
          echo "----- Output on EC2 -----"
          echo "$RESULT" | jq -r '.StandardOutputContent'
          echo "----- Errors on EC2 -----"
          echo "$RESULT" | jq -r '.StandardErrorContent'
          STATUS=$(echo "$RESULT" | jq -r '.Status')
          echo "SSM status: $STATUS"

          # The step (and the job) fails unless SSM reports Success
          [ "$STATUS" = "Success" ]
